<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav Fijo -->
  <mat-sidenav #sidenav class="sidenav" [mode]="sidenavMode()" [opened]="sidenavOpened()">
    <!-- Logo -->
    <div class="logo">
      <mat-icon class="logo-icon">school</mat-icon>
      <span class="logo-text">School Manager</span>
    </div>

    <!-- Menu Items -->
    <mat-nav-list class="nav-list">
      <mat-list-item
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
        (click)="onMenuItemClick()"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </mat-list-item>
    </mat-nav-list>

    <!-- User Footer -->
    <div class="user-footer">
      <div class="avatar">AD</div>
      <div class="user-info">
        <div class="user-name">Admin User</div>
        <div class="user-role">Administrador</div>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="main-content">
    <!-- Header Superior -->
    <header class="main-header">
      <div class="header-content">
        <button mat-icon-button class="menu-toggle" (click)="toggleSidenav()" *ngIf="isMobile()">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="header-title">{{ currentPageTitle() }}</div>
        <span class="spacer"></span>
        <div class="search-container">
          <mat-icon class="search-icon">search</mat-icon>
          <input type="text" class="search-input" placeholder="Buscar..." />
        </div>
        <div class="avatar-header">AD</div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
